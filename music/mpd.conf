# MPD Configuration
# Lokasi file-file mpd
music_directory     "~/Music"
playlist_directory  "~/.local/share/mpd/playlists"
db_file             "~/.local/share/mpd/database"
log_file            "~/.local/share/mpd/log"
pid_file            "~/.local/share/mpd/pid"
state_file          "~/.local/share/mpd/state"
sticker_database    "~/.local/share/mpd/sticker.db"

# Network
bind_to_address     "localhost"
port                "6600"

# Audio output - PipeWire native
audio_output {
    type            "pipewire"
    name            "PipeWire Output"
}

# Fallback kalau pipewire gak works, uncomment ini dan comment block di atas:
# audio_output {
#     type            "pulse"
#     name            "PulseAudio (PipeWire compat)"
# }

# Resampling (opsional, bagus untuk kualitas)
samplerate_converter    "medium"

# Log level: default, secure, verbose
log_level               "default"
